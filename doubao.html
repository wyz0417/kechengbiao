<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渐习 · 豆包识别</title>
<style>body{font:16px system-ui;max-width:760px;margin:32px auto;padding:16px;color:#294534}input,button{font:inherit;padding:12px;margin:8px 0;max-width:100%;box-sizing:border-box}input{display:block;width:100%}button{cursor:pointer}img{max-width:100%;max-height:400px}td{border-bottom:1px solid #ddd;padding:8px}table{width:100%}#status{white-space:pre-wrap;line-height:1.7}</style>
<p><a href="./">← 返回渐习课程表</a></p><h1>豆包课表识别</h1><p>图片将通过腾讯云接口发送给火山方舟。结果必须校对，不包含教学周限制。</p>
<label>访问口令（ACCESS_TOKEN，不是豆包 API Key）<input id="token" type="password" autocomplete="off"></label>
<label>选择课表图片（最大3 MB）<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" hidden alt="待识别课表">
<button id="start" type="button">上传并识别</button><p id="status" role="status"></p><table id="results"></table><button id="download" type="button" hidden>下载课表备份</button>
<p>下载后回到渐习，点击“导入课程表”→“导入 JSON 备份”。此页面不保存访问口令和图片。</p>
<script>
const API='https://1486281001-0vdzupjjsr.ap-nanjing.tencentscf.com/recognize',$=id=>document.getElementById(id);let courses=[],previewUrl=null;
$('file').onchange=()=>{courses=[];$('download').hidden=true;$('results').replaceChildren();if(previewUrl)URL.revokeObjectURL(previewUrl);const f=$('file').files[0];$('preview').hidden=!f;if(f){previewUrl=URL.createObjectURL(f);$('preview').src=previewUrl;}};
$('start').onclick=async()=>{const f=$('file').files[0],token=$('token').value;if(!f||!token){$('status').textContent='请选择图片并填写访问口令。';return;}if(f.size>3*1024*1024){$('status').textContent='图片超过3 MB，请压缩或裁剪。';return;}$('start').disabled=true;$('status').textContent='正在上传并调用豆包，请稍候…';try{const image=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(f);});const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Access-Token':token},body:JSON.stringify({image})});const data=await response.json();if(!response.ok)throw Error(data.error||'识别失败');courses=data.courses;$('status').textContent=`识别到 ${courses.length} 条课程，请校对名称。`;for(const c of courses){const tr=document.createElement('tr');tr.innerHTML=`<td>周${'一二三四五六日'[c.day]}</td><td>第${c.start}行</td>`;const td=document.createElement('td'),input=document.createElement('input');input.value=c.name;input.oninput=()=>c.name=input.value.trim();td.append(input);tr.append(td);$('results').append(tr);}$('download').hidden=false;}catch(e){$('status').textContent=e.message+'；图片与口令已保留。';}finally{$('start').disabled=false;}};
$('download').onclick=()=>{if(courses.some(c=>!c.name)){$('status').textContent='请补齐空白课程名称。';return;}const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);const termStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const state={version:1,namesOnly:true,title:'我的课程表',termStart,scope:'week',periods:Math.max(...courses.map(c=>c.end)),demo:false,progress:{},courses:courses.map((c,i)=>({...c,id:'doubao-'+Date.now()+'-'+i}))};const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='豆包识别课表.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
